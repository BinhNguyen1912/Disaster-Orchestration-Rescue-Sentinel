$kind: http-request
name: POST /auth/reset-password
description: Reset password with OTP and resetToken
url: "{{baseUrl}}/auth/reset-password"
method: POST
body:
  type: json
  content: |-
    {
        "resetToken": "uuid-from-forgot-password-response",
        "otp": "123456",
        "newPassword": "newpassword123"
    }
order: 6000
